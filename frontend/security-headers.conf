# Cabeçalhos de defesa dos arquivos estáticos da SPA.
#
# As respostas de /api/ NÃO passam por aqui: o próprio FastAPI já as carimba, e
# repetir os cabeçalhos no proxy produziria valores duplicados (dois
# X-Frame-Options em conflito podem ser ignorados pelo navegador).
#
# Este arquivo é incluído em cada location estático porque um `add_header`
# declarado dentro de um location descarta todos os herdados do server.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; child-src 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
