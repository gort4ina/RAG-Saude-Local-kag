# Rate limit de borda, complementar ao do backend. Este atua por IP antes de
# chegar na aplicação; o do FastAPI atua por identidade autenticada. O binário
# $binary_remote_addr ocupa menos memória que o endereço textual.
limit_req_zone $binary_remote_addr zone=api_geral:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=conexoes:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # Não anuncia a versão do nginx nas respostas e nas páginas de erro.
    server_tokens off;

    # Bloqueia métodos que a API não usa.
    if ($request_method !~ ^(GET|HEAD|POST|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    limit_conn conexoes 24;

    # Autenticação é o alvo natural de força bruta: cota bem mais apertada.
    location = /api/auth/token {
        limit_req zone=api_login burst=5 nodelay;
        proxy_pass http://api:8000/api/auth/token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Streaming NDJSON: sem buffer, senao o nginx segura os tokens e o
    # usuario so ve a resposta no final.
    location /api/chat/stream {
        limit_req zone=api_geral burst=20 nodelay;
        proxy_pass http://api:8000/api/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Geração local via Ollama pode passar de 60s em CPU.
    location /api/ {
        limit_req zone=api_geral burst=40 nodelay;
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # O index precisa ser revalidado sempre: ele referencia os bundles com
    # hash, e uma cópia velha apontaria para arquivos que não existem mais.
    # Usa-se `expires` em vez de `add_header` de propósito: um `add_header`
    # dentro do location descartaria todos os cabeçalhos de segurança
    # declarados no server.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        expires -1;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Arquivos de controle de versão ou configuração nunca devem ser servidos.
    location ~ /\. {
        deny all;
        return 404;
    }
}
